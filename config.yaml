# ⚠️ 下面这个值是**故意的金丝雀**（原开发机的路径），不是漏改的残留，**别"清理"它**：
# bootstrap 第 1 步靠 `_foreign_profile_owner` 认出「这台机器还没铺过环境 / 整包拷贝带了老机器的
# config.local.yaml」—— 认出来才会提示你加 `-InstallerDir` 重跑。换成 `C:/Users/Public/...`
# （脚本自己的默认值）这条检查就失效了，新机取包失败**而报错长得像"共享盘坏了"**。
# 真值写在被 .gitignore 的 `config.local.yaml` 里。约束见 AGENTS.md「机器绝对路径不进代码」。
installer_dir: "C:/Users/ASUS/Desktop/华硕大厅"
baseline_setup: "myappstore_1.6.8.17S_Setup.exe"
latest_setup: "myappstore_1.6.10.7S_Setup.exe"

# 安装包获取（组长 2026-09-18 要求：脚本在测试机自动下载对应大厅）。
# 查找顺序：installer_dir 直属 -> installer_dir/_cache -> 共享盘 -> 下载。
# url_template 支持 {filename} 占位；不填走默认 CDN（dlcdnets.asus.com）。
# sha256 是「文件名 -> 期望摘要」映射，填了才校验，不填只记录实际值。
download:
  url_template: ""
  # 举例（拿到官方直链后填这里，防下到半截包）：
  # sha256:
  #   myappstore_1.6.8.17S_Setup.exe: "<64位十六进制>"
  sha256: {}

# 共享盘分发（没有官方下载地址时的主路）。2026-09-18 实测：本机建 hall-packages 共享，
# 另一台机器用 `net use \\LAPTOP-VS5F7HF4\hall-packages /user:hallshare "<密码>"` 可访问。
# 共享盘不可达会被静默跳过（自动降级到下载），绝不因为共享盘挂了让整轮跑批失败。
# 环境变量 HALL_PACKAGE_SHARE 可临时覆盖（单机切换用，不必改配置）。
#
# ⚠️ **写机器名，不要写 IP**：本机 IP 由 DHCP 分配，会变。
# 2026-09-18 实测就踩过：配的是 `//192.168.0.4/...`，机器重启后 IP 变成 192.168.0.8，
# 于是所有节点报「找不到网络名（系统错误 67）」—— 看起来像共享没建，实际是 IP 过期。
# 机器名（NetBIOS/LLMNR 解析）在同一局域网里是稳的。
package_share:
  dirs:
    - "//LAPTOP-VS5F7HF4/hall-packages"
  # 例（多共享盘做冗余，按顺序试，不可达的会被跳过）：
  # dirs:
  #   - "//LAPTOP-VS5F7HF4/hall-packages"       # 机器名访问（推荐）
  #   - "//192.168.0.8/hall-packages"           # 备用：本机当时 IP，会随 DHCP 变化

display_name_contains: "华硕大厅"
search_keyword: "qq"
search_min_hits: 2

timeouts:
  install_sec: 900
  uninstall_sec: 300
  version_settle_sec: 180
  process_stop_sec: 30
  launch_sec: 45
  ready_sec: 90

launch:
  cold_starts: 3
  required_auto_ids:
    - SearchBarInput
    - TabList
    - MainWeb
  webview_ready_names:
    - 专题页
  popup_whitelist_keywords:
    - 启动卡片
    - 更新
    - 协议
    - 隐私
    - 权限
    - 须知
    - 条款
    - 欢迎使用
  update_or_card_keywords:
    - 启动卡片
    - 更新
  dismiss_buttons:
    - 关闭
    - 取消
    - 稍后
    - 以后再说
    - 我知道了
  accept_buttons:
    - 同意
    - 确定
    - 允许
    - 是

accounts:
  password:
    user: ""
    password: ""
  microsoft:
    user: ""
    password: ""

fixture_apps:
  install: ""
  update: ""
  uninstall: ""
  sync: ""

# P1-A 更新夹具：钉一个官方老版本，大厅目录里就永远有更新可点。
# package 是相对 installer_dir 的路径；sha256 防本地包被换；版本号一律运行时读，不写死。
update_fixture:
  name: ""
  registry_hint: ""
  pinned_version: ""
  package: ""
  sha256: ""
  url: ""
  install_dir: ""
  version_exe: ""

# P2 安全验证（组长用例表「安全验证」板块的固定项：安装包数字签名 / 个人空间盘签名 /
# 控制面板信息 / 签章检查报告）。CheckAppV.exe、SignCheck_v2.ps1 是公司内部工具，
# 不进仓库：tools_dir 每台机器在 config.local.yaml 指到本地目录，空则用例 skip。
security:
  tools_dir: ""
  seven_zip: "C:/Program Files/7-Zip/7z.exe"
  personal_storage_dir: "C:/Program Files (x86)/ASUS/PersonalStorage"
  package: ""
  work_dir: ""
  # 行 14「安全清单 vs 安装包清单对比」：manifest 是开发给的安全清单（一行一个相对包根
  # 路径，容忍 csv 首列与 # 注释），相对 installer_dir 或绝对路径；空则用例 skip。
  # manifest_scope 决定对比范围：signable 只比可签名文件，all 比包内全部文件。
  manifest: ""
  manifest_scope: "signable"
