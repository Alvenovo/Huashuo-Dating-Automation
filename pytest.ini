[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    unit: 不改机器状态
    install: P0 安装 / 升级
    launch: P0 启动 / 首页就绪
    smoke: 冒烟
    destructive: 会装卸华硕大厅或夹具应用，需 --allow-install 或 HALL_ALLOW_INSTALL=1
    login: P1 账号相关（登录/注册/找回）；密码登录用例需 HALL_TEST_USER / HALL_TEST_PASSWORD
    apps: P1-A 应用生命周期；检测类不改机器状态，真装真卸类同时带 destructive 走门禁
    settings: P1-C 设置页；会改客户端外观档位，用例收尾还原成进来时的档位
    security: P2 安全验证（安装包/个人空间盘数字签名、控制面板信息、签章检查报告）；只读安装包与产品目录，只写工作目录
    wb: P2 WorkBuddy 入口集成；单机未登录态只读+点击，绝不点「一键安装」，独立跑不进无人值守回归
    manual: 人在环用例，中途停下等人工输入（会真发短信）；只在用户自己终端显式 -m manual 跑，无人值守套件一律排除。⚠️ 必须加 -s：pytest 默认捕获会把 sys.stdin 换成 DontReadFromInput，sys.stdin.isatty() 恒 False → 三条全 skip 还报「退出码 0」（2026-09-22 真机踩过）。走 tools\farm_agent.py --local login-manual 时 -s 由套件定义自动带上
filterwarnings =
    ignore::DeprecationWarning
