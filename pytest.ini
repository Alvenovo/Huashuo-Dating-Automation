[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    unit: 不改机器状态
    install: P0 安装 / 升级
    launch: P0 启动 / 首页就绪
    smoke: 冒烟
    destructive: 会装卸华硕大厅或夹具应用，需 --allow-install 或 HALL_ALLOW_INSTALL=1
    login: P1 账号相关（登录/注册/找回）；密码登录用例需 HALL_TEST_USER / HALL_TEST_PASSWORD
    apps: P1-A 应用生命周期；检测类不改机器状态，真装真卸类同时带 destructive 走门禁
    settings: P1-C 设置页；会改客户端外观档位，用例收尾还原成进来时的档位
    manual: 人在环用例，中途停下等人工输入（会真发短信）；只在用户自己终端显式 -m manual 跑，无人值守套件一律排除
filterwarnings =
    ignore::DeprecationWarning
